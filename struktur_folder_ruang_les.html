function badge(b, imp){
  let html = '';
  if(b) html += `<span class="badge ${b}">${{fe:'Frontend',be:'Backend',db:'Database',cfg:'Config'}[b]}</span>`;
  if(imp) html += `<span class="badge imp">⭐ Penting</span>`;
  return html;
}

function renderNode(node, depth=0){
  const hasChildren = node.children && node.children.length > 0;
  const id = 'n'+Math.random().toString(36).substr(2,9);
  
  let html = `<div>`;
  html += `<div class="node" ${hasChildren?`onclick="toggle('${id}')"`:''}  style="padding-left:${depth*18}px">`;
  html += `<span class="toggle ${hasChildren?'open':''}" id="t${id}">${hasChildren?'▶':''}</span>`;
  html += `<span class="icon">${node.icon||'📄'}</span>`;
  html += `<span class="name">${node.name}</span>`;
  html += badge(node.badge, node.imp);
  if(node.comment) html += `<span class="comment">— ${node.comment}</span>`;
  html += `</div>`;
  
  if(hasChildren){
    html += `<div id="${id}" class="">`;
    for(const child of node.children){
      html += renderNode(child, depth+1);
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function toggle(id){
  const el = document.getElementById(id);
  const t = document.getElementById('t'+id);
  if(el.classList.contains('collapsed')){
    el.classList.remove('collapsed');
    t.classList.add('open');
  } else {
    el.classList.add('collapsed');
    t.classList.remove('open');
  }
}

function expandAll(){
  document.querySelectorAll('[id^="n"]').forEach(el=>{
    el.classList.remove('collapsed');
  });
  document.querySelectorAll('[id^="tn"]').forEach(el=>{
    el.classList.add('open');
  });
}
function collapseAll(){
  document.querySelectorAll('[id^="n"]').forEach(el=>{
    el.classList.add('collapsed');
  });
  document.querySelectorAll('[id^="tn"]').forEach(el=>{
    el.classList.remove('open');
  });
}

document.getElementById('tree').innerHTML = renderNode(data);
</script>
